name: Build and release

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      otp_ref:
        description: "OTP tag or commit (empty uses .github/build.json)"
        type: string
      publish_release:
        description: "Create a draft release after all native builds pass"
        type: boolean
        default: false
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

concurrency:
  group: elixiraotc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      otp_sha: ${{ steps.resolve.outputs.otp_sha }}
      elixir_sha: ${{ steps.resolve.outputs.elixir_sha }}
      hex_version: ${{ steps.resolve.outputs.hex_version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node --test .github/scripts/resolve.test.cjs
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: resolve
        env:
          REQUESTED_OTP_REF: ${{ inputs.otp_ref }}
        with:
          script: |
            const resolve = require('./.github/scripts/resolve.cjs');
            await resolve({github, context, core});

  test:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-x86_64}
          - {os: ubuntu-24.04-arm, target: linux-arm64}
          - {os: macos-15, target: darwin-arm64}
          - {os: macos-15-intel, target: darwin-x86_64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      OTP_SHA: ${{ needs.resolve.outputs.otp_sha }}
      ELIXIR_SHA: ${{ needs.resolve.outputs.elixir_sha }}
      HEX_VERSION: ${{ needs.resolve.outputs.hex_version }}
      AOTC_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y build-essential autoconf libncurses-dev libssl-dev unzip
          else
            brew install autoconf openssl@3
          fi
      - name: Build patched OTP and run release and self-hosting checks
        run: bash .github/scripts/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: elixiraotc-${{ matrix.target }}
          path: |
            dist/elixiraotc-${{ matrix.target }}
            dist/elixiraotc-native-sdk-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [resolve, test]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          otp-version: "29.0.3"
          elixir-version: "1.20.2"
      - run: elixir .github/scripts/manifest_test.exs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: elixiraotc-*
          merge-multiple: true
          path: dist
      - name: Generate manifest and checksums
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          OTP_SHA: ${{ needs.resolve.outputs.otp_sha }}
          ELIXIR_SHA: ${{ needs.resolve.outputs.elixir_sha }}
          HEX_VERSION: ${{ needs.resolve.outputs.hex_version }}
        run: elixir .github/scripts/manifest.exs dist
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/*
      - name: Create draft release without changing a branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$REPOSITORY" --target "$SOURCE_SHA" --draft \
            --title "$RELEASE_TAG" --notes-file .github/release-notes.md
